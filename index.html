<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Gambar - Mabar Pro</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #10B981;
            --danger: #EF4444;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-light: #6B7280;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            overflow: hidden;
        }

        h1 { color: var(--primary); font-weight: 800; margin: 0 0 20px 0; }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #E5E7EB;
            border-radius: 10px; font-family: inherit; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary); }

        button {
            width: 100%; padding: 12px; background-color: var(--primary); color: white;
            border: none; border-radius: 10px; font-weight: 600; font-size: 16px;
            cursor: pointer; transition: 0.2s; margin-bottom: 10px; font-family: inherit;
        }
        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button.btn-green { background-color: var(--secondary); }
        button.btn-green:hover { background-color: #059669; }
        button.btn-gray { background-color: #9CA3AF; }
        button.btn-gray:hover { background-color: #6B7280; }

        /* Room List */
        .room-list { max-height: 250px; overflow-y: auto; text-align: left; margin-bottom: 15px; }
        .room-item {
            background: #F9FAFB; border: 1px solid #E5E7EB; padding: 15px; border-radius: 10px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .room-item .room-name { font-weight: 600; }
        .room-item button { width: auto; margin: 0; padding: 8px 15px; font-size: 14px; }

        /* Game Area */
        .info-panel { background-color: #EEF2FF; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .role-drawer { background-color: #FEE2E2; color: #B91C1C; }
        .role-guesser { background-color: #D1FAE5; color: #047857; }
        #word-display { font-size: 18px; font-weight: 800; color: var(--secondary); margin-top: 5px; }
        
        canvas { background: #fff; border: 2px solid #E5E7EB; border-radius: 12px; cursor: crosshair; touch-action: none; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chat-box { background: #F9FAFB; padding: 10px; border-radius: 10px; height: 120px; overflow-y: auto; text-align: left; font-size: 14px; margin-bottom: 10px; border: 1px solid #E5E7EB;}
        .chat-msg { border-bottom: 1px solid #eee; padding: 5px 0; }
        .sys-msg { color: var(--primary); font-style: italic; font-weight: bold; text-align: center; }

        #input-guess-area { display: flex; gap: 10px; }
        #input-guess-area input { margin-bottom: 0; }
        #input-guess-area button { width: auto; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-palette"></i> Tebak Gambar</h1>

    <!-- 1. SCREEN HOME -->
    <div id="screen-home" class="screen active">
        <p style="color: var(--text-light); margin-bottom: 20px;">Main tebak gambar seru bareng teman!</p>
        <button onclick="showScreen('screen-host-join')"><i class="fa-solid fa-users"></i> Multiplayer</button>
    </div>

    <!-- 2. SCREEN HOST / JOIN -->
    <div id="screen-host-join" class="screen">
        <button onclick="showScreen('screen-create-room')"><i class="fa-solid fa-plus"></i> Host (Buat Room)</button>
        <button class="btn-green" onclick="loadRooms(); showScreen('screen-room-list')"><i class="fa-solid fa-list"></i> Join (Cari Room)</button>
        <button class="btn-gray" onclick="showScreen('screen-home')">Kembali</button>
    </div>

    <!-- 3. SCREEN CREATE ROOM (HOST) -->
    <div id="screen-create-room" class="screen">
        <h3>Buat Room Baru</h3>
        <input type="text" id="hostRoomName" placeholder="Nama Room (Misal: Kamar Keren)" maxlength="20">
        <!-- Input password dibuat tipe tel/number agar keyboard angka muncul di HP -->
        <input type="tel" id="hostRoomPass" placeholder="Password (Hanya Angka)" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="6">
        <button class="btn-green" onclick="createRoom()">Buat Lobby</button>
        <button class="btn-gray" onclick="showScreen('screen-host-join')">Batal</button>
    </div>

    <!-- 4. SCREEN ROOM LIST (JOIN) -->
    <div id="screen-room-list" class="screen">
        <h3>Daftar Room Aktif</h3>
        <div class="room-list" id="roomListDiv">
            <!-- List room dimunculkan dari JS -->
        </div>
        <button class="btn-gray" onclick="showScreen('screen-host-join')">Kembali</button>
    </div>

    <!-- 5. SCREEN LOBBY (WAITING ROOM) -->
    <div id="screen-lobby" class="screen">
        <h3 id="lobbyRoomName">Room: -</h3>
        <div class="info-panel" id="lobbyStatus">
            <i class="fa-solid fa-spinner fa-spin"></i> Menunggu pemain lain...
        </div>
        <button id="btnStartGame" class="btn-green" style="display: none;" onclick="startGame()">Mulai Game!</button>
        <button class="btn-gray" onclick="leaveRoom()">Keluar Lobby</button>
    </div>

    <!-- 6. SCREEN GAME -->
    <div id="screen-game" class="screen">
        <div class="info-panel">
            <div id="status-text" style="font-weight:bold; color:var(--primary); margin-bottom: 5px;">Game Dimulai!</div>
            <span id="role-badge" class="role-badge">Peran</span>
            <div id="word-display-container">
                <p style="margin: 5px 0 0 0; font-size: 12px;">Gambar kata ini:</p>
                <div id="word-display"></div>
            </div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="300"></canvas>
            <button id="btnClear" onclick="clearCanvas()" style="position: absolute; top:5px; right:5px; width:auto; padding:5px 10px; background:rgba(255,255,255,0.9); color:red; border:1px solid #ccc; font-size:12px; display:none;"><i class="fa-solid fa-trash"></i> Hapus</button>
        </div>
        
        <div class="chat-box" id="chatBox"></div>
        
        <div id="input-guess-area">
            <input type="text" id="guessInput" placeholder="Ketik tebakanmu..." onkeypress="if(event.key==='Enter') kirimTebakan()">
            <button onclick="kirimTebakan()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
        <button class="btn-gray" onclick="leaveRoom()" style="margin-top: 10px;">Keluar Room</button>
    </div>
</div>

<script>
    // KONFIGURASI FIREBASE USER
    const firebaseConfig = {
        apiKey: "AIzaSyBBNc_H9SA7WrIagS8f-5uHggeU7ODia7Q",
        authDomain: "qrtes12.firebaseapp.com",
        databaseURL: "https://qrtes12-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "qrtes12",
        storageBucket: "qrtes12.firebasestorage.app",
        messagingSenderId: "993597353524",
        appId: "1:993597353524:web:151391426bf44c22aee461"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // VARIABEL GLOBAL
    let myPlayerId = ''; // 'player1' (host) atau 'player2' (joiner)
    let currentRoomId = '';
    let myRole = ''; // 'drawer' atau 'guesser'
    let isDrawing = false;
    let gameActive = false;
    let roomListener = null;

    const kataRahasiaList = ["kucing", "gunung", "rumah", "pohon", "bintang", "buku", "kacamata", "mobil", "ikan", "apel", "sepeda"];
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1F2937';

    // NAVIGASI SCREEN
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ==========================================
    // 1. LOGIKA HOST (BUAT ROOM)
    // ==========================================
    function createRoom() {
        const name = document.getElementById('hostRoomName').value.trim();
        const pass = document.getElementById('hostRoomPass').value.trim();
        
        if (!name || !pass) return alert("Nama room dan password wajib diisi!");
        
        const roomRef = db.ref('rooms').push(); // Bikin ID unik
        currentRoomId = roomRef.key;
        myPlayerId = 'player1'; // Host selalu player1

        roomRef.set({
            name: name,
            password: pass,
            status: 'waiting', // waiting, playing
            player1: true,
            player2: false,
            currentTurn: 'player1', // Player 1 menggambar duluan
            word: getRandomWord(),
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        document.getElementById('lobbyRoomName').innerText = `Room: ${name}`;
        document.getElementById('lobbyStatus').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menunggu pemain lain (Player 2)...';
        document.getElementById('btnStartGame').style.display = 'none';

        showScreen('screen-lobby');
        listenToRoomLobby();
    }

    // ==========================================
    // 2. LOGIKA JOIN (CARI ROOM)
    // ==========================================
    function loadRooms() {
        const listDiv = document.getElementById('roomListDiv');
        listDiv.innerHTML = '<p style="text-align:center;">Mencari room...</p>';

        db.ref('rooms').orderByChild('status').equalTo('waiting').once('value', snapshot => {
            listDiv.innerHTML = '';
            if (!snapshot.exists()) {
                listDiv.innerHTML = '<p style="text-align:center; color:var(--text-light);">Tidak ada room tersedia. Buat room sendiri (Host)!</p>';
                return;
            }
            
            snapshot.forEach(child => {
                const data = child.val();
                if(!data.player2) { // Tampilkan hanya jika player2 belum ada
                    listDiv.innerHTML += `
                        <div class="room-item">
                            <span class="room-name"><i class="fa-solid fa-gamepad"></i> ${data.name}</span>
                            <button class="btn-green" onclick="joinRoom('${child.key}', '${data.password}', '${data.name}')">Join</button>
                        </div>
                    `;
                }
            });
        });
    }

    function joinRoom(roomId, realPass, roomName) {
        const inputPass = prompt(`Masukkan password (angka) untuk bergabung ke room "${roomName}":`);
        if (inputPass === null) return; // User cancel
        
        if (inputPass === realPass) {
            currentRoomId = roomId;
            myPlayerId = 'player2'; // Joiner selalu player2

            // Update Firebase bahwa player 2 sudah masuk
            db.ref(`rooms/${roomId}`).update({ player2: true });

            document.getElementById('lobbyRoomName').innerText = `Room: ${roomName}`;
            document.getElementById('lobbyStatus').innerHTML = '<i class="fa-solid fa-check" style="color:green;"></i> Berhasil masuk! Menunggu Host memulai game...';
            document.getElementById('btnStartGame').style.display = 'none';

            showScreen('screen-lobby');
            listenToRoomLobby();
        } else {
            alert("Password Salah!");
        }
    }

    // ==========================================
    // 3. LOGIKA LOBBY & MULAI GAME
    // ==========================================
    function listenToRoomLobby() {
        if(roomListener) db.ref(`rooms/${currentRoomId}`).off('value', roomListener);

        roomListener = db.ref(`rooms/${currentRoomId}`).on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return leaveRoom(true); // Room dihapus

            // Jika host, dan player 2 masuk -> Tampilkan tombol mulai
            if (myPlayerId === 'player1' && data.player2 && data.status === 'waiting') {
                document.getElementById('lobbyStatus').innerHTML = '<i class="fa-solid fa-user-check" style="color:green;"></i> Pemain 2 telah bergabung!';
                document.getElementById('btnStartGame').style.display = 'block';
            }

            // Jika status berubah jadi playing, masuk ke layar game
            if (data.status === 'playing') {
                db.ref(`rooms/${currentRoomId}`).off('value', roomListener); // Stop listener lobby
                masukKeGame(data);
            }
        });
    }

    function startGame() {
        // Cuma Host yang bisa klik ini
        db.ref(`rooms/${currentRoomId}`).update({ status: 'playing' });
    }

    function leaveRoom(forced = false) {
        if (currentRoomId) {
            // Hapus room jika host yg keluar, atau hapus player2 jika joiner yg keluar
            if (myPlayerId === 'player1') {
                db.ref(`rooms/${currentRoomId}`).remove();
            } else {
                db.ref(`rooms/${currentRoomId}`).update({ player2: false });
            }
        }
        currentRoomId = '';
        if(forced) alert("Room telah ditutup / tidak valid.");
        window.location.reload(); // Refresh bersih
    }

    // ==========================================
    // 4. LOGIKA GAME & GANTI GILIRAN
    // ==========================================
    function masukKeGame(data) {
        showScreen('screen-game');
        document.getElementById('chatBox').innerHTML = ''; // Reset chat
        gameActive = true;
        
        setupGiliran(data.currentTurn, data.word);
        listenToGameSync();
    }

    function setupGiliran(currentTurn, word) {
        // Tentukan peran berdasarkan siapa giliran saat ini
        if (currentTurn === myPlayerId) {
            // GILIRAN SAYA MENGGAMBAR
            myRole = 'drawer';
            document.getElementById('role-badge').className = 'role-badge role-drawer';
            document.getElementById('role-badge').innerHTML = '<i class="fa-solid fa-pencil"></i> Kamu Menggambar';
            document.getElementById('input-guess-area').style.display = 'none';
            document.getElementById('word-display-container').style.display = 'block';
            document.getElementById('word-display').innerText = word.toUpperCase();
            document.getElementById('btnClear').style.display = 'block';
        } else {
            // GILIRAN TEMAN, SAYA MENEBAK
            myRole = 'guesser';
            document.getElementById('role-badge').className = 'role-badge role-guesser';
            document.getElementById('role-badge').innerHTML = '<i class="fa-solid fa-lightbulb"></i> Kamu Menebak';
            document.getElementById('input-guess-area').style.display = 'flex';
            document.getElementById('word-display-container').style.display = 'none';
            document.getElementById('btnClear').style.display = 'none';
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Bersihkan canvas tiap ganti giliran
        gameActive = true;
    }

    function listenToGameSync() {
        const roomRef = db.ref(`rooms/${currentRoomId}`);

        // Pantau Perubahan Giliran & Kata
        roomRef.on('value', snap => {
            const data = snap.val();
            if(!data) return;
            
            // Jika giliran di DB berubah dari state saat ini, update UI
            if(data.currentTurn && data.currentTurn !== (myRole === 'drawer' ? myPlayerId : (myPlayerId==='player1'?'player2':'player1'))) {
                 setupGiliran(data.currentTurn, data.word);
            }
        });

        // Pantau Garis Gambar
        roomRef.child('drawing').on('child_added', snap => {
            if (myRole === 'guesser') {
                let pos = snap.val();
                if (pos.type === 'start') {
                    ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
                } else if (pos.type === 'draw') {
                    ctx.lineTo(pos.x, pos.y); ctx.stroke();
                }
            }
        });

        // Pantau Chat & Tebakan
        roomRef.child('chats').on('child_added', snap => {
            let chat = snap.val();
            let div = document.createElement('div'); div.className = 'chat-msg';
            
            if (chat.isSystem) {
                div.innerHTML = `<div class="sys-msg">${chat.text}</div>`;
            } else if (chat.isCorrect) {
                div.innerHTML = `<b>${chat.sender}:</b> <span style="color:var(--secondary); font-weight:bold;">BENAR! (${chat.text.toUpperCase()}) 🎉</span>`;
                handleCorrectGuess(); 
            } else {
                div.innerHTML = `<b>${chat.sender}:</b> ${chat.text}`;
            }
            const cb = document.getElementById('chatBox');
            cb.appendChild(div); cb.scrollTop = cb.scrollHeight;
        });

        // Pantau Hapus Canvas
        roomRef.child('clear').on('value', snap => {
            if(snap.val()) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath();
            }
        });
    }

    function kirimTebakan() {
        if(!gameActive || myRole !== 'guesser') return;
        const guess = document.getElementById('guessInput').value.trim().toLowerCase();
        if(!guess) return;

        db.ref(`rooms/${currentRoomId}/word`).once('value', snap => {
            const realWord = snap.val();
            const isCorrect = (guess === realWord);
            
            db.ref(`rooms/${currentRoomId}/chats`).push({
                sender: myPlayerId === 'player1' ? 'Pemain 1' : 'Pemain 2',
                text: guess,
                isCorrect: isCorrect
            });

            document.getElementById('guessInput').value = '';

            // Jika benar, PEMENEBAK bertugas men-trigger pergantian giliran
            if(isCorrect) {
                gameActive = false; // Kunci game sementara
                setTimeout(() => {
                    const nextTurn = myPlayerId; // Pemenebak sekarang jadi penggambar
                    db.ref(`rooms/${currentRoomId}`).update({
                        currentTurn: nextTurn,
                        word: getRandomWord()
                    });
                    // Bersihkan history gambar di DB
                    db.ref(`rooms/${currentRoomId}/drawing`).remove();
                    // Kirim pesan sistem
                    db.ref(`rooms/${currentRoomId}/chats`).push({ isSystem: true, text: '🔄 Giliran berganti!' });
                }, 3000); // Jeda 3 detik untuk selebrasi
            }
        });
    }

    function handleCorrectGuess() {
        gameActive = false;
        document.getElementById('status-text').innerText = "Tebakan Benar! Bersiap ganti giliran...";
        setTimeout(() => {
            document.getElementById('status-text').innerText = "Game Berlangsung...";
        }, 3000);
    }

    // ==========================================
    // KONTROL CANVAS MENGGAMBAR
    // ==========================================
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let cX = e.touches ? e.touches[0].clientX : e.clientX;
        let cY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cX - rect.left) * scaleX, y: (cY - rect.top) * scaleY };
    }

    function pushPoint(type, x, y) {
        if (myRole === 'drawer' && gameActive) {
            db.ref(`rooms/${currentRoomId}/drawing`).push({ type, x, y });
        }
    }

    function clearCanvas() {
        if (myRole === 'drawer') {
            db.ref(`rooms/${currentRoomId}/clear`).set(Date.now());
            db.ref(`rooms/${currentRoomId}/drawing`).remove();
        }
    }

    // Mouse Events
    canvas.addEventListener('mousedown', e => { if(myRole !== 'drawer' || !gameActive) return; isDrawing = true; let p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); pushPoint('start', p.x, p.y); });
    canvas.addEventListener('mousemove', e => { if(!isDrawing || myRole !== 'drawer' || !gameActive) return; let p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); pushPoint('draw', p.x, p.y); });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseout', () => isDrawing = false);

    // Touch Events
    canvas.addEventListener('touchstart', e => { if(myRole !== 'drawer' || !gameActive) return; e.preventDefault(); isDrawing = true; let p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); pushPoint('start', p.x, p.y); }, {passive:false});
    canvas.addEventListener('touchmove', e => { if(!isDrawing || myRole !== 'drawer' || !gameActive) return; e.preventDefault(); let p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); pushPoint('draw', p.x, p.y); }, {passive:false});
    canvas.addEventListener('touchend', () => isDrawing = false);

    // Utils
    function getRandomWord() { return kataRahasiaList[Math.floor(Math.random() * kataRahasiaList.length)]; }

</script>

</body>
</html>
