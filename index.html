<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mabar Pro - Draw & Guess</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        :root { --primary: #4F46E5; --secondary: #10B981; --danger: #EF4444; --bg: #F3F4F6; --card: #FFFFFF; --text: #1F2937; --gold: #F59E0B; --purple: #8B5CF6; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .container { background: var(--card); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px; width: 100%; max-width: 450px; text-align: center; position: relative; }
        .server-status { position: absolute; top: 15px; right: 20px; font-size: 10px; font-weight: 600; display: flex; align-items: center; gap: 5px; color: #6B7280; }
        .lang-toggle { position: absolute; top: 10px; left: 15px; font-size: 20px; cursor: pointer; padding: 5px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s infinite; } .status-dot.online { background: var(--secondary); animation: none; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        h1 { color: var(--primary); font-weight: 800; margin: 15px 0 20px 0; font-size: 24px; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #E5E7EB; border-radius: 10px; font-family: inherit; box-sizing: border-box; text-align: center; font-size:14px; }
        button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; font-family: inherit; }
        button:hover { filter: brightness(0.9); } button:active { transform: scale(0.98); }
        button.btn-green { background: var(--secondary); } button.btn-gray { background: #9CA3AF; } button.btn-danger { background: var(--danger); } button.btn-gold { background: var(--gold); } button.btn-purple { background: var(--purple); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #fff; padding: 20px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; animation: popIn 0.3s; max-height: 80vh; overflow-y: auto;}
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .avatar-selection { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; } .avatar-opt { width: 45px; height: 45px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; opacity: 0.5;} .avatar-opt.selected { border-color: var(--primary); opacity: 1; transform: scale(1.1); } .avatar-opt img { width: 100%; height: 100%; border-radius: 50%; }
        
        /* Tools Canvas & Draw Battle */
        #gameCanvas { background: #fff; border: 2px solid #E5E7EB; border-radius: 12px; cursor: crosshair; touch-action: none; width: 100%; aspect-ratio: 4/5; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 10px; padding: 5px; background: #F9FAFB; border-radius: 10px; }
        .tool-btn { width: auto; padding: 5px 15px; margin:0; font-size: 12px; background: #E5E7EB; color: var(--text); border-radius: 20px;} .tool-btn.active { background: var(--primary); color: white; }
        .color-palette { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 10px; }
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; } .color-btn.active { border-color: #000; transform: scale(1.2); }
        
        /* Layout Multiplayer */
        .player-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .player-badge { background: #EEF2FF; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; border: 1px solid #C7D2FE;}
        .player-badge img { width: 20px; height: 20px; border-radius: 50%; }
        
        /* Gallery Voting */
        .gallery-item { border: 2px solid #E5E7EB; border-radius: 10px; margin-bottom: 15px; padding: 10px; background: #FAFAFA; }
        .gallery-item img { width: 100%; border-radius: 8px; border: 1px solid #ccc; }
        .star-rating { color: #ccc; font-size: 24px; cursor: pointer; } .star-rating .checked { color: var(--gold); }
        
        /* Slot Machine */
        #slotMachine { font-size: 24px; font-weight: 800; color: var(--primary); height: 40px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #EEF2FF; border-radius: 10px; margin-bottom:10px;}
    </style>
</head>
<body>

<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <div id="modalTitle" style="font-weight:bold; font-size:18px; margin-bottom:10px;">Alert</div>
        <div id="modalContent" style="font-size:14px; margin-bottom:15px; color:#6B7280;">Message</div>
        <input type="text" id="modalInput" style="display:none;" placeholder="...">
        <div id="modalActions" style="display:flex; gap:10px; justify-content:center;"></div>
    </div>
</div>

<div class="container">
    <div class="lang-toggle" onclick="toggleLanguage()" id="flagIcon">🇮🇩</div>
    <div class="server-status"><span id="serverStatusText">Con...</span><div id="serverStatusDot" class="status-dot"></div></div>
    <h1><i class="fa-solid fa-palette"></i> <span class="t-title">Mabar Pro</span></h1>

    <!-- 0. PROFILING -->
    <div id="screen-profile" class="screen">
        <p class="t-prof-sub" style="font-size: 14px; color: #6B7280;">Siapkan profilmu / Setup profile!</p>
        <div class="avatar-selection" id="avatarSelection">
            <div class="avatar-opt selected" onclick="selectAvatar(this, 'Felix')"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Felix"></div>
            <div class="avatar-opt" onclick="selectAvatar(this, 'Aneka')"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Aneka"></div>
            <div class="avatar-opt" onclick="selectAvatar(this, 'Jude')"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Jude"></div>
            <div class="avatar-opt" onclick="selectAvatar(this, 'Mimi')"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Mimi"></div>
        </div>
        <input type="text" id="usernameInput" class="t-ph-name" placeholder="Nama / Name (Max 10)" maxlength="10">
        <button onclick="saveProfile()" class="t-btn-next"><i class="fa-solid fa-arrow-right"></i> Lanjut</button>
    </div>

    <!-- 1. HOME -->
    <div id="screen-home" class="screen">
        <div style="margin-bottom: 20px; font-weight:bold; color:var(--primary);"><span class="t-hello">Halo</span>, <span id="displayMyName">Kamu</span>!</div>
        <button class="btn-purple" onclick="startMatchmaking()"><i class="fa-solid fa-earth-asia"></i> <span class="t-btn-match">Cari Lawan (Auto)</span></button>
        <div style="height:1px; background:#E5E7EB; margin:15px 0;"></div>
        <button onclick="showScreen('screen-create')"><i class="fa-solid fa-plus"></i> <span class="t-btn-host">Host Room</span></button>
        <button class="btn-green" onclick="loadRooms(); showScreen('screen-join')"><i class="fa-solid fa-list"></i> <span class="t-btn-join">Join Room</span></button>
    </div>

    <!-- 2. CREATE ROOM -->
    <div id="screen-create" class="screen">
        <h3 class="t-title-create" style="margin-top:0">Buat Room</h3>
        <select id="hostGameMode" onchange="updateMaxPlayersUI()">
            <option value="guess">Mode: Tebak Gambar (1v1)</option>
            <option value="battle">Mode: Draw Battle (2-5 P)</option>
        </select>
        <select id="hostMaxPlayers" style="display:none;">
            <option value="2">2 Pemain (AI Rating)</option>
            <option value="3">3 Pemain (Voting)</option>
            <option value="4">4 Pemain (Voting)</option>
            <option value="5">5 Pemain (Voting)</option>
        </select>
        <input type="text" id="hostRoomName" placeholder="Nama Room" maxlength="15">
        <input type="password" id="hostRoomPass" placeholder="Password (Kosongi jika bebas)">
        <button class="btn-green t-btn-create" onclick="createRoom()">Buat</button>
        <button class="btn-gray t-btn-cancel" onclick="showScreen('screen-home')">Batal</button>
    </div>

    <!-- 3. JOIN ROOM -->
    <div id="screen-join" class="screen">
        <h3 class="t-title-join" style="margin-top:0">Daftar Room</h3>
        <div class="room-list" id="roomListDiv"></div>
        <button class="btn-gray t-btn-cancel" onclick="showScreen('screen-home')">Batal</button>
    </div>

    <!-- 4. LOBBY -->
    <div id="screen-lobby" class="screen">
        <h3 id="lobbyRoomName" style="margin-top:0">Room</h3>
        <div class="player-list" id="lobbyPlayers"></div>
        <div id="lobbyStatus" style="font-size:12px; margin-bottom:15px; color:#6B7280;"><i class="fa-solid fa-spinner fa-spin"></i> Menunggu...</div>
        <button id="btnStartGame" class="btn-green t-btn-start" style="display:none;" onclick="startGame()">Mulai Game!</button>
        <button class="btn-gray t-btn-leave" onclick="leaveRoom()">Keluar</button>
    </div>

    <!-- 5. IN-GAME (GUESS & BATTLE SHARED) -->
    <div id="screen-game" class="screen">
        <!-- Header Info -->
        <div style="display:flex; justify-content:space-between; align-items:center; background:#EEF2FF; padding:10px; border-radius:10px; margin-bottom:10px; font-weight:bold;">
            <div id="gameModeText" style="color:var(--primary); font-size:14px;">Mode</div>
            <div style="color:var(--danger); font-size:20px; width:50px;" id="gameTimer">60</div>
        </div>
        
        <div id="slotMachine" style="display:none;">---</div>
        <div id="gameInstruction" style="font-weight:bold; color:var(--secondary); margin-bottom:10px; font-size:16px;">Instruksi</div>

        <!-- CANVAS AREA -->
        <div class="canvas-container" id="canvasArea">
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            
            <!-- Tools for Drawer / Battle Mode -->
            <div id="drawTools" style="display:none;">
                <div class="toolbar">
                    <button class="tool-btn active" id="btnBrush" onclick="setTool('brush')"><i class="fa-solid fa-paint-brush"></i> Kuas</button>
                    <button class="tool-btn" id="btnBucket" onclick="setTool('bucket')"><i class="fa-solid fa-fill-drip"></i> Cat</button>
                    <button class="tool-btn" onclick="ctx.clearRect(0,0,canvas.width,canvas.height)"><i class="fa-solid fa-trash"></i> Bersihkan</button>
                </div>
                <div class="color-palette">
                    <!-- Colors will be injected by JS -->
                </div>
            </div>
        </div>

        <!-- CHAT AREA (For Guess Mode) -->
        <div id="guessArea" style="display:none;">
            <div class="chat-box" id="chatBox"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="guessInput" placeholder="..." onkeypress="if(event.key==='Enter') submitGuess()">
                <button style="width:auto; margin:0; padding:0 20px;" onclick="submitGuess()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- VOTING AREA (For Battle Mode) -->
        <div id="votingArea" style="display:none; max-height:400px; overflow-y:auto;">
            <!-- Gallery injected here -->
        </div>

        <button class="btn-danger t-btn-leave" style="margin-top:15px;" onclick="leaveRoom()">Menyerah & Keluar</button>
    </div>
</div>

<script>
    // --- 1. SETUP FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyBBNc_H9SA7WrIagS8f-5uHggeU7ODia7Q",
        authDomain: "qrtes12.firebaseapp.com",
        databaseURL: "https://qrtes12-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "qrtes12",
        storageBucket: "qrtes12.firebasestorage.app",
        messagingSenderId: "993597353524",
        appId: "1:993597353524:web:151391426bf44c22aee461"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref(".info/connected").on("value", (snap) => {
        const t = document.getElementById('serverStatusText'), d = document.getElementById('serverStatusDot');
        if (snap.val()) { t.innerText = "Online"; d.classList.add('online'); } else { t.innerText = "Offline"; d.classList.remove('online'); }
    });

    // --- 2. MULTILANGUAGE & DATABASE KATA ---
    let lang = 'id';
    const dict = {
        id: { title: "Tebak & Gambar", hello: "Halo", btnMatch: "Cari Lawan (Auto)", btnHost: "Host Room", btnJoin: "Join Room", phName: "Nama Kamu", btnNext: "Lanjut", titleCreate: "Buat Room Baru", titleJoin: "Daftar Room", btnCreate: "Buat", btnCancel: "Batal", btnStart: "Mulai Game", btnLeave: "Keluar", brush: "Kuas", bucket: "Ember", clear: "Hapus", modeGuess: "Mode: Tebak Gambar", modeBattle: "Mode: Draw Battle", aiEvaluating: "🤖 AI Sedang Menilai...", voting: "Beri Nilai Gambar Lain!" },
        en: { title: "Draw & Guess", hello: "Hello", btnMatch: "Find Match (Auto)", btnHost: "Host Room", btnJoin: "Join Room", phName: "Your Name", btnNext: "Next", titleCreate: "Create Room", titleJoin: "Room List", btnCreate: "Create", btnCancel: "Cancel", btnStart: "Start Game", btnLeave: "Leave", brush: "Brush", bucket: "Bucket", clear: "Clear", modeGuess: "Mode: Guessing", modeBattle: "Mode: Draw Battle", aiEvaluating: "🤖 AI is Evaluating...", voting: "Rate Others' Drawings!" }
    };

    // 50+ Words Categorized
    const wordsDB = {
        id: [
            // Buah
            "Apel", "Pisang", "Jeruk", "Semangka", "Nanas", "Mangga", "Stroberi", "Anggur", "Durian", "Alpukat", "Melon", "Pepaya", "Kiwi", "Ceri",
            // Benda
            "Sepeda", "Laptop", "Gitar", "Kamera", "Jam Tangan", "Kacamata", "Buku", "Payung", "Sepatu", "Topi", "Lampu", "Kulkas", "Televisi", "Pensil", "Gunting",
            // Hewan
            "Kucing", "Anjing", "Gajah", "Singa", "Harimau", "Kuda", "Jerapah", "Monyet", "Kelinci", "Burung Hantu", "Ikan Hiu", "Paus", "Penguin", "Ular",
            // Kartun/Pop
            "Doraemon", "SpongeBob", "Pikachu", "Naruto", "Mickey Mouse", "Spiderman", "Batman", "Alien", "Robot", "Naga", "Kastil", "Satelit", "Roket"
        ],
        en: [
            "Apple", "Banana", "Orange", "Watermelon", "Pineapple", "Mango", "Strawberry", "Grape", "Durian", "Avocado", "Melon", "Papaya", "Kiwi", "Cherry",
            "Bicycle", "Laptop", "Guitar", "Camera", "Watch", "Glasses", "Book", "Umbrella", "Shoes", "Hat", "Lamp", "Fridge", "Television", "Pencil", "Scissors",
            "Cat", "Dog", "Elephant", "Lion", "Tiger", "Horse", "Giraffe", "Monkey", "Rabbit", "Owl", "Shark", "Whale", "Penguin", "Snake",
            "Doraemon", "SpongeBob", "Pikachu", "Naruto", "Mickey Mouse", "Spiderman", "Batman", "Alien", "Robot", "Dragon", "Castle", "Satellite", "Rocket"
        ]
    };

    function toggleLanguage() {
        lang = lang === 'id' ? 'en' : 'id';
        document.getElementById('flagIcon').innerText = lang === 'id' ? '🇮🇩' : '🇬🇧';
        
        document.querySelector('.t-title').innerText = dict[lang].title;
        document.querySelector('.t-hello').innerText = dict[lang].hello;
        document.querySelector('.t-btn-match').innerText = dict[lang].btnMatch;
        document.querySelector('.t-btn-host').innerText = dict[lang].btnHost;
        document.querySelector('.t-btn-join').innerText = dict[lang].btnJoin;
        document.querySelector('.t-ph-name').placeholder = dict[lang].phName;
        document.querySelector('.t-title-create').innerText = dict[lang].titleCreate;
        document.querySelector('.t-title-join').innerText = dict[lang].titleJoin;
        document.querySelectorAll('.t-btn-cancel').forEach(e=>e.innerText = dict[lang].btnCancel);
        
        if(gameMode === 'guess') document.getElementById('gameModeText').innerText = dict[lang].modeGuess;
        if(gameMode === 'battle') document.getElementById('gameModeText').innerText = dict[lang].modeBattle;
    }

    // --- 3. GLOBAL VARIABLES ---
    let myUser = { id: '', name: '', avatar: 'https://api.dicebear.com/7.x/pixel-art/svg?seed=Felix' };
    let currentRoomId = ''; let roomListener = null;
    let isHost = false;
    let gameMode = 'guess'; // 'guess' or 'battle'
    let players = {}; // Object to hold 2-5 players
    let timerInterval = null, timeLeft = 0, currentTurn = '';
    let gameActive = false, myRole = '';
    let targetWord = '';

    // CANVAS VARIABLES
    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    let isDrawing = false, currentTool = 'brush', currentColor = '#000000';
    const colors = ['#000000', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#6B7280', '#FFFFFF', '#8B4513', '#FFD700', '#00FFFF'];

    window.onload = () => {
        setupColors();
        const saved = localStorage.getItem('mabarProUser');
        if(saved) {
            myUser = JSON.parse(saved);
            document.getElementById('displayMyName').innerText = myUser.name;
            document.getElementById('usernameInput').value = myUser.name;
            showScreen('screen-home');
        } else showScreen('screen-profile');
    };

    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function selectAvatar(el, seed) { document.querySelectorAll('.avatar-opt').forEach(e=>e.classList.remove('selected')); el.classList.add('selected'); myUser.avatar = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${seed}`; }
    function saveProfile() {
        const name = document.getElementById('usernameInput').value.trim();
        if(!name) return alert("Isi nama dulu!");
        myUser.id = 'p_' + Date.now() + Math.floor(Math.random()*1000); // Unique ID
        myUser.name = name; localStorage.setItem('mabarProUser', JSON.stringify(myUser));
        document.getElementById('displayMyName').innerText = name; showScreen('screen-home');
    }

    // --- 4. ROOM MANAGEMENT ---
    function updateMaxPlayersUI() {
        const mode = document.getElementById('hostGameMode').value;
        document.getElementById('hostMaxPlayers').style.display = mode === 'battle' ? 'block' : 'none';
    }

    function createRoom() {
        const name = document.getElementById('hostRoomName').value.trim() || 'Room Seru';
        const pass = document.getElementById('hostRoomPass').value.trim();
        const mode = document.getElementById('hostGameMode').value;
        const maxP = mode === 'guess' ? 2 : parseInt(document.getElementById('hostMaxPlayers').value);

        currentRoomId = db.ref('rooms').push().key; isHost = true;
        let pData = {}; pData[myUser.id] = myUser;

        db.ref('rooms/'+currentRoomId).set({
            name, password: pass, status: 'waiting', mode, maxPlayers: maxP,
            players: pData, scores: {}, word: '', phase: 'lobby', timer: 0, timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        db.ref('rooms/'+currentRoomId).onDisconnect().remove();

        showScreen('screen-lobby'); listenToRoom();
    }

    function loadRooms() {
        document.getElementById('roomListDiv').innerHTML = '<p>Mencari...</p>';
        db.ref('rooms').orderByChild('status').equalTo('waiting').once('value', snap => {
            let h = '';
            if(snap.exists()) {
                snap.forEach(c => {
                    let d = c.val();
                    let pCount = d.players ? Object.keys(d.players).length : 0;
                    if(pCount < d.maxPlayers) {
                        h += `<div class="room-item">
                            <div><b>${d.name}</b> <br><span style="font-size:10px;">Mode: ${d.mode} | ${pCount}/${d.maxPlayers} Org</span></div>
                            <button class="btn-green" onclick="joinRoom('${c.key}', '${d.password}')">Join</button>
                        </div>`;
                    }
                });
            }
            document.getElementById('roomListDiv').innerHTML = h || '<p>Tidak ada room.</p>';
        });
    }

    function joinRoom(id, reqPass) {
        if(reqPass) {
            let pass = prompt("Masukkan Password Room:");
            if(pass !== reqPass) return alert("Password Salah!");
        }
        currentRoomId = id; isHost = false;
        db.ref(`rooms/${id}/players/${myUser.id}`).set(myUser);
        db.ref(`rooms/${id}/players/${myUser.id}`).onDisconnect().remove();
        showScreen('screen-lobby'); listenToRoom();
    }

    function startMatchmaking() {
        // Simple matchmaking logic (joins first available waiting battle room, or creates one)
        db.ref('rooms').orderByChild('status').equalTo('waiting').once('value', snap => {
            let joined = false;
            if(snap.exists()){
                snap.forEach(c => {
                    let d = c.val(); let pCount = Object.keys(d.players||{}).length;
                    if(d.mode === 'battle' && pCount < d.maxPlayers && d.password === '' && !joined) {
                        joinRoom(c.key, ''); joined = true;
                    }
                });
            }
            if(!joined) { // Create auto room
                currentRoomId = db.ref('rooms').push().key; isHost = true;
                let pData = {}; pData[myUser.id] = myUser;
                db.ref('rooms/'+currentRoomId).set({ name: "Auto Match", password: "", status: 'waiting', mode: 'battle', maxPlayers: 5, players: pData, phase: 'lobby' });
                db.ref('rooms/'+currentRoomId).onDisconnect().remove();
                showScreen('screen-lobby'); listenToRoom();
            }
        });
    }

    function leaveRoom() {
        if(currentRoomId) {
            if(isHost) db.ref('rooms/'+currentRoomId).remove();
            else db.ref(`rooms/${currentRoomId}/players/${myUser.id}`).remove();
        }
        window.location.reload();
    }

    // --- 5. MAIN ROOM LISTENER ---
    function listenToRoom() {
        if(roomListener) db.ref('rooms/'+currentRoomId).off('value', roomListener);
        roomListener = db.ref('rooms/'+currentRoomId).on('value', snap => {
            const data = snap.val();
            if(!data) { alert("Room ditutup/dihapus."); window.location.reload(); return; }

            players = data.players || {};
            let pKeys = Object.keys(players);
            
            // UPDATE LOBBY UI
            document.getElementById('lobbyRoomName').innerText = `Room: ${data.name} (${data.mode.toUpperCase()})`;
            let pUI = '';
            pKeys.forEach(k => { pUI += `<div class="player-badge"><img src="${players[k].avatar}"> ${players[k].name}</div>`; });
            document.getElementById('lobbyPlayers').innerHTML = pUI;

            if(isHost) {
                if(pKeys.length >= 2 && data.phase === 'lobby') document.getElementById('btnStartGame').style.display = 'block';
                else document.getElementById('btnStartGame').style.display = 'none';
            }

            // ROUTER PHASE GAME
            gameMode = data.mode;
            if(data.phase === 'playing') handleGamePhase(data, pKeys);
            else if(data.phase === 'voting') handleVotingPhase(data);
            else if(data.phase === 'gameover') handleGameOver(data);
        });
    }

    function startGame() {
        const words = wordsDB[lang];
        const randomWord = words[Math.floor(Math.random() * words.length)];
        
        let updateData = { status: 'playing', phase: 'playing', word: randomWord };
        
        if(gameMode === 'guess') {
            let pKeys = Object.keys(players);
            updateData.currentTurn = pKeys[0]; // Player 1 is drawer
            updateData.timer = 60; // 60s for guessing
        } else {
            // BATTLE MODE
            updateData.timer = 100; // 100s for drawing battle
        }
        
        db.ref('rooms/'+currentRoomId).update(updateData);
        if(isHost) runServerTimer(updateData.timer);
    }

    // Server Timer Simulation (Host controls DB Timer)
    function runServerTimer(duration) {
        let t = duration;
        let iv = setInterval(() => {
            t--;
            db.ref(`rooms/${currentRoomId}/timer`).set(t);
            if(t <= 0) {
                clearInterval(iv);
                handleTimeUp();
            }
        }, 1000);
    }

    function handleTimeUp() {
        db.ref(`rooms/${currentRoomId}`).once('value', snap => {
            const d = snap.val();
            if(d.mode === 'guess') {
                // Switch turn or game over
                db.ref(`rooms/${currentRoomId}`).update({ phase: 'gameover' }); // Simplification for merging
            } else if (d.mode === 'battle' && d.phase === 'playing') {
                // Go to evaluating/voting
                db.ref(`rooms/${currentRoomId}`).update({ phase: 'voting' });
            }
        });
    }

    // --- 6. GAME LOGIC HANDLER ---
    function handleGamePhase(data, pKeys) {
        showScreen('screen-game');
        document.getElementById('gameModeText').innerText = gameMode === 'guess' ? dict[lang].modeGuess : dict[lang].modeBattle;
        document.getElementById('gameTimer').innerText = data.timer;
        targetWord = data.word;

        if(gameMode === 'guess') {
            document.getElementById('drawTools').style.display = (data.currentTurn === myUser.id) ? 'block' : 'none';
            document.getElementById('guessArea').style.display = (data.currentTurn === myUser.id) ? 'none' : 'block';
            document.getElementById('votingArea').style.display = 'none';
            document.getElementById('gameInstruction').innerText = (data.currentTurn === myUser.id) ? `GAMBAR: ${targetWord.toUpperCase()}` : `Menebak...`;
            
            // Sync Canvas Strokes for Guess Mode
            listenToStrokes();

        } else if (gameMode === 'battle') {
            document.getElementById('drawTools').style.display = 'block';
            document.getElementById('guessArea').style.display = 'none';
            document.getElementById('votingArea').style.display = 'none';
            
            // Slot Machine Effect on Start
            if(data.timer > 96) { // first 3-4 seconds
                document.getElementById('slotMachine').style.display = 'flex';
                document.getElementById('gameInstruction').style.display = 'none';
                canvas.style.pointerEvents = 'none';
                slotMachineEffect(wordsDB[lang]);
            } else {
                document.getElementById('slotMachine').style.display = 'none';
                document.getElementById('gameInstruction').style.display = 'block';
                document.getElementById('gameInstruction').innerText = `GAMBAR: ${targetWord.toUpperCase()}`;
                canvas.style.pointerEvents = 'auto';
            }

            // At the end of battle drawing, auto-submit canvas
            if(data.timer === 1) {
                let imgData = canvas.toDataURL("image/png");
                db.ref(`rooms/${currentRoomId}/gallery/${myUser.id}`).set(imgData);
            }
        }
    }

    let slotIV = null;
    function slotMachineEffect(words) {
        if(slotIV) return;
        const el = document.getElementById('slotMachine');
        slotIV = setInterval(() => {
            el.innerText = words[Math.floor(Math.random()*words.length)];
        }, 100);
        setTimeout(() => { clearInterval(slotIV); slotIV = null; }, 3000);
    }

    // --- 7. VOTING & AI RATING (BATTLE MODE) ---
    function handleVotingPhase(data) {
        document.getElementById('canvasArea').style.display = 'none';
        document.getElementById('drawTools').style.display = 'none';
        document.getElementById('votingArea').style.display = 'block';
        document.getElementById('gameInstruction').innerText = "Waktu Habis!";
        
        let pKeys = Object.keys(data.players || {});
        
        if (pKeys.length === 2) {
            // 2 PLAYER AI SIMULATION
            document.getElementById('votingArea').innerHTML = `<h3>${dict[lang].aiEvaluating}</h3><div class="status-dot" style="margin:20px auto; width:30px; height:30px;"></div>`;
            if(isHost) {
                setTimeout(() => {
                    // MOCK AI LOGIC: Random score between 50-100 for fun
                    let s1 = Math.floor(Math.random()*50)+50;
                    let s2 = Math.floor(Math.random()*50)+50;
                    let p1 = pKeys[0], p2 = pKeys[1];
                    let updates = {}; updates[`scores/${p1}`] = s1; updates[`scores/${p2}`] = s2; updates['phase'] = 'gameover';
                    db.ref(`rooms/${currentRoomId}`).update(updates);
                }, 3500);
            }
        } else {
            // 3-5 PLAYER HUMAN VOTING
            document.getElementById('gameInstruction').innerText = dict[lang].voting;
            let galleryHtml = '';
            pKeys.forEach(k => {
                if(data.gallery && data.gallery[k]) {
                    galleryHtml += `<div class="gallery-item">
                        <div style="font-weight:bold; margin-bottom:5px;">🖼️ Gambar ${data.players[k].name}</div>
                        <img src="${data.gallery[k]}">
                        ${k !== myUser.id ? `
                        <div class="star-rating" data-target="${k}">
                            <i class="fa-solid fa-star" onclick="rateImage('${k}', 1)"></i>
                            <i class="fa-solid fa-star" onclick="rateImage('${k}', 2)"></i>
                            <i class="fa-solid fa-star" onclick="rateImage('${k}', 3)"></i>
                            <i class="fa-solid fa-star" onclick="rateImage('${k}', 4)"></i>
                            <i class="fa-solid fa-star" onclick="rateImage('${k}', 5)"></i>
                        </div>` : `<div style="color:var(--primary); font-size:12px;">(Gambarmu)</div>`}
                    </div>`;
                }
            });
            
            if(isHost) galleryHtml += `<button class="btn-danger" onclick="endVoting()">Selesai Voting</button>`;
            document.getElementById('votingArea').innerHTML = galleryHtml;
        }
    }

    function rateImage(targetId, stars) {
        db.ref(`rooms/${currentRoomId}/votes/${targetId}/${myUser.id}`).set(stars);
        // Visual feedback
        let parent = document.querySelector(`.star-rating[data-target="${targetId}"]`);
        let starEls = parent.querySelectorAll('i');
        starEls.forEach((s, idx) => { if(idx < stars) s.classList.add('checked'); else s.classList.remove('checked'); });
    }

    function endVoting() {
        // Sum scores
        db.ref(`rooms/${currentRoomId}`).once('value', snap => {
            let d = snap.val(); let finalScores = {};
            if(d.votes) {
                Object.keys(d.votes).forEach(targetP => {
                    let sum = 0;
                    Object.values(d.votes[targetP]).forEach(v => sum+=v);
                    finalScores[targetP] = sum * 10; // multiply by 10 to make it looks like "points"
                });
            }
            db.ref(`rooms/${currentRoomId}`).update({ scores: finalScores, phase: 'gameover' });
        });
    }

    // --- 8. GAME OVER ---
    function handleGameOver(data) {
        document.getElementById('votingArea').innerHTML = '';
        let resultHtml = `<h2><i class="fa-solid fa-trophy" style="color:gold;"></i> Skor Akhir</h2>`;
        
        let pKeys = Object.keys(data.players || {});
        let arr = pKeys.map(k => ({ name: data.players[k].name, score: (data.scores && data.scores[k]) ? data.scores[k] : 0 }));
        arr.sort((a,b) => b.score - a.score); // Highest first

        arr.forEach((p, idx) => {
            resultHtml += `<div class="gallery-item" style="display:flex; justify-content:space-between; font-weight:bold;">
                <span>#${idx+1} ${p.name}</span>
                <span style="color:var(--primary);">${p.score} Pts</span>
            </div>`;
        });
        
        resultHtml += `<button class="btn-gray" onclick="leaveRoom()">Kembali Ke Menu</button>`;
        document.getElementById('votingArea').style.display = 'block';
        document.getElementById('votingArea').innerHTML = resultHtml;
    }

    // --- 9. CANVAS TOOLS & FLOOD FILL ---
    function setupColors() {
        const pal = document.querySelector('.color-palette');
        colors.forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.backgroundColor = c;
            if(c==='#000000') b.classList.add('active');
            b.onclick = () => { document.querySelectorAll('.color-btn').forEach(e=>e.classList.remove('active')); b.classList.add('active'); currentColor = c; ctx.strokeStyle = c; };
            pal.appendChild(b);
        });
    }
    
    function setTool(t) {
        currentTool = t;
        document.querySelectorAll('.tool-btn').forEach(e=>e.classList.remove('active'));
        if(t==='brush') document.getElementById('btnBrush').classList.add('active');
        if(t==='bucket') document.getElementById('btnBucket').classList.add('active');
    }

    function getPos(e) {
        const r = canvas.getBoundingClientRect(); const sX = canvas.width/r.width; const sY = canvas.height/r.height;
        let cX = e.touches ? e.touches[0].clientX : e.clientX; let cY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: Math.floor((cX-r.left)*sX), y: Math.floor((cY-r.top)*sY) };
    }

    canvas.addEventListener('mousedown', startAction);
    canvas.addEventListener('mousemove', moveAction);
    window.addEventListener('mouseup', endAction);
    canvas.addEventListener('touchstart', (e)=>{e.preventDefault(); startAction(e);}, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{e.preventDefault(); moveAction(e);}, {passive:false});
    canvas.addEventListener('touchend', endAction);

    function startAction(e) {
        if(canvas.style.pointerEvents === 'none') return;
        let p = getPos(e);
        if(currentTool === 'bucket') {
            floodFill(p.x, p.y, hexToRgb(currentColor));
            if(gameMode === 'guess') syncFill(p.x, p.y, currentColor);
        } else {
            isDrawing = true; ctx.beginPath(); ctx.moveTo(p.x, p.y);
            if(gameMode === 'guess') db.ref(`rooms/${currentRoomId}/drawing`).push({ t:'s', x:p.x, y:p.y, c:currentColor });
        }
    }
    function moveAction(e) {
        if(!isDrawing || currentTool !== 'brush') return;
        let p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
        if(gameMode === 'guess') db.ref(`rooms/${currentRoomId}/drawing`).push({ t:'d', x:p.x, y:p.y, c:currentColor });
    }
    function endAction() { isDrawing = false; }

    // Sync strokes (Only for Guess Mode)
    function listenToStrokes() {
        db.ref(`rooms/${currentRoomId}/drawing`).on('child_added', snap => {
            if(myUser.id !== currentTurn) { // if I am guesser
                let p = snap.val();
                ctx.strokeStyle = p.c;
                if(p.t==='s') { ctx.beginPath(); ctx.moveTo(p.x, p.y); }
                else if(p.t==='d') { ctx.lineTo(p.x, p.y); ctx.stroke(); }
                else if(p.t==='f') { floodFill(p.x, p.y, hexToRgb(p.c)); }
            }
        });
    }
    function syncFill(x,y,c) { db.ref(`rooms/${currentRoomId}/drawing`).push({ t:'f', x, y, c }); }

    // FAST FLOOD FILL ALGORITHM (Iterative)
    function hexToRgb(h) { let r=0,g=0,b=0; if(h.length===7){ r=parseInt(h.substring(1,3),16); g=parseInt(h.substring(3,5),16); b=parseInt(h.substring(5,7),16); } return [r,g,b,255]; }
    function floodFill(startX, startY, fillColor) {
        let w = canvas.width, h = canvas.height;
        let imgData = ctx.getImageData(0,0,w,h);
        let data = imgData.data;
        let startIdx = (startY * w + startX) * 4;
        let startR = data[startIdx], startG = data[startIdx+1], startB = data[startIdx+2], startA = data[startIdx+3];
        
        if(startR===fillColor[0] && startG===fillColor[1] && startB===fillColor[2] && startA===fillColor[3]) return;

        let stack = [[startX, startY]];
        while(stack.length) {
            let [x, y] = stack.pop();
            let idx = (y * w + x) * 4;
            if(x>=0 && x<w && y>=0 && y<h && data[idx]===startR && data[idx+1]===startG && data[idx+2]===startB && data[idx+3]===startA) {
                data[idx]=fillColor[0]; data[idx+1]=fillColor[1]; data[idx+2]=fillColor[2]; data[idx+3]=fillColor[3];
                stack.push([x+1,y], [x-1,y], [x,y+1], [x,y-1]);
            }
        }
        ctx.putImageData(imgData,0,0);
    }
</script>
